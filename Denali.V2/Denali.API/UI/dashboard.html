<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="lightweight-charts.standalone.production.js"></script>
    <script src="dashboard.js"></script>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div>
        <div class="row">
            <label for="symbolInput">Symbol:</label>
            <input type="text" id="symbolInput" />

            <label for="startDateInput">Start:</label>
            <input type="date" id="startDateInput" />

            <label for="endDateInput">End:</label>
            <input type="date" id="endDateInput" />

            <select id="timeframe-input">
                <option value="1Min">1Min</option>
                <option value="15Min">15Min</option>
                <option value="1D">1D</option>
            </select>

            <button onClick="OnSubmit()">Submit</button>
        </div>  
    </div>
    <div class="column">
        <span id="price-value">Price: </span>
        <span id="fast-value">Fast EMA: </span>
        <span id="slow-value">Slow EMA: </span>
    </div>
    <div id="chartContainer">

    </div>
</body>
</html>
